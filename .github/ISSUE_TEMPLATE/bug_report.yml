name: Bug report
description: Report a problem with an otp.com SDK, the MCP server, or the contract.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For **security vulnerabilities**, do not file an issue;
        see SECURITY.md and email security@otp.com.
  - type: dropdown
    id: repo
    attributes:
      label: Which tool?
      options: [sdk-node, sdk-php, sdk-go, sdk-python, mcp, sdk (contract), not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package/tool version (e.g. 1.2.3).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant output. Redact any API keys or personal data.
      render: shell
